databaseChangeLog:
  - changeSet:
      id: 001-create-catalog-tables
      author: anuh-collections
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: slug
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sku
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(180)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(2000)
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: stock_quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(1000)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_products_category

        - createIndex:
            tableName: products
            indexName: idx_products_category
            columns:
              - column:
                  name: category_id

  - changeSet:
      id: 002-seed-jewellery-categories
      author: anuh-collections
      changes:
        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Tulip Chains
              - column:
                  name: slug
                  value: tulip-chains

        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Bracelets
              - column:
                  name: slug
                  value: bracelets

        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Earrings
              - column:
                  name: slug
                  value: earrings

        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Rings
              - column:
                  name: slug
                  value: rings

        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Crochet Keychains
              - column:
                  name: slug
                  value: crochet-keychains

  - changeSet:
      id: 003-create-users
      author: anuh-collections
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-create-carts
      author: anuh-collections
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: carts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_carts_user

        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: cart_id
            referencedTableName: carts
            referencedColumnNames: id
            constraintName: fk_cart_items_cart
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_cart_items_product

        - addUniqueConstraint:
            tableName: cart_items
            columnNames: cart_id, product_id
            constraintName: uq_cart_items_cart_product

        - createIndex:
            tableName: cart_items
            indexName: idx_cart_items_product
            columns:
              - column:
                  name: product_id

  - changeSet:
      id: 005-create-wishlists
      author: anuh-collections
      changes:
        - createTable:
            tableName: wishlists
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: wishlists
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_wishlists_user

        - createTable:
            tableName: wishlist_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: wishlist_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: wishlist_items
            baseColumnNames: wishlist_id
            referencedTableName: wishlists
            referencedColumnNames: id
            constraintName: fk_wishlist_items_wishlist
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: wishlist_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_wishlist_items_product

        - addUniqueConstraint:
            tableName: wishlist_items
            columnNames: wishlist_id, product_id
            constraintName: uq_wishlist_items_wishlist_product

        - createIndex:
            tableName: wishlist_items
            indexName: idx_wishlist_items_product
            columns:
              - column:
                  name: product_id

  - changeSet:
      id: 006-create-addresses
      author: anuh-collections
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: address_line1
                  type: VARCHAR(180)
                  constraints:
                    nullable: false
              - column:
                  name: address_line2
                  type: VARCHAR(180)
              - column:
                  name: landmark
                  type: VARCHAR(120)
              - column:
                  name: city
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: postal_code
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(60)
                  defaultValue: India
                  constraints:
                    nullable: false
              - column:
                  name: default_address
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: addresses
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_addresses_user
            onDelete: CASCADE

        - createIndex:
            tableName: addresses
            indexName: idx_addresses_user
            columns:
              - column:
                  name: user_id

  - changeSet:
      id: 007-create-orders
      author: anuh-collections
      changes:
        - createTable:
            tableName: customer_orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_number
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_fee
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: shipping_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_phone
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_address_line1
                  type: VARCHAR(180)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_address_line2
                  type: VARCHAR(180)
              - column:
                  name: shipping_landmark
                  type: VARCHAR(120)
              - column:
                  name: shipping_city
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_state
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_postal_code
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_country
                  type: VARCHAR(60)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: customer_orders
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_customer_orders_user

        - createIndex:
            tableName: customer_orders
            indexName: idx_customer_orders_user
            columns:
              - column:
                  name: user_id

        - createTable:
            tableName: customer_order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
              - column:
                  name: sku
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: product_slug
                  type: VARCHAR(180)
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(1000)
              - column:
                  name: unit_price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: line_total
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: customer_order_items
            baseColumnNames: order_id
            referencedTableName: customer_orders
            referencedColumnNames: id
            constraintName: fk_customer_order_items_order
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: customer_order_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_customer_order_items_product
            onDelete: SET NULL

        - createIndex:
            tableName: customer_order_items
            indexName: idx_customer_order_items_order
            columns:
              - column:
                  name: order_id

  - changeSet:
      id: 008-add-razorpay-order-fields
      author: anuh-collections
      changes:
        - addColumn:
            tableName: customer_orders
            columns:
              - column:
                  name: gateway_order_id
                  type: VARCHAR(80)
              - column:
                  name: gateway_payment_id
                  type: VARCHAR(80)
              - column:
                  name: gateway_refund_id
                  type: VARCHAR(80)
              - column:
                  name: gateway_payment_method
                  type: VARCHAR(30)

        - addUniqueConstraint:
            tableName: customer_orders
            columnNames: gateway_order_id
            constraintName: uq_customer_orders_gateway_order

        - addUniqueConstraint:
            tableName: customer_orders
            columnNames: gateway_payment_id
            constraintName: uq_customer_orders_gateway_payment

  - changeSet:
      id: 009-add-order-shipping-tracking
      author: anuh-collections
      changes:
        - addColumn:
            tableName: customer_orders
            columns:
              - column:
                  name: shipping_carrier
                  type: VARCHAR(80)
              - column:
                  name: tracking_number
                  type: VARCHAR(100)
              - column:
                  name: tracking_url
                  type: VARCHAR(1000)